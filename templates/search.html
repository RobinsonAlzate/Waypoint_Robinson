{% extends "base.html" %}
{% block title %}Search · Waypoint{% endblock %}
{% block content %}
<h1>Search Trails</h1>
<form method="get" action="{% url 'search' %}">
    <input type="text" name="q" value="{{ query }}" placeholder="Search trails...">
    <button type="submit">Search</button>
</form>
{% if query %}<p>Results for &ldquo;{{ query }}&rdquo;:</p>{% endif %}
{% endblock %}
